<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Autoevaluación: Evaluación del Progreso en el Aprendizaje</title>
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --ink: #0f172a; --accent: #2563eb;
  }
  body {
    margin: 0; font-family: 'Inter', system-ui, sans-serif;
    background: linear-gradient(180deg, #eef6ff 0%, #f8fafc 100%);
    color: var(--ink); padding: 24px;
  }
  .container {
    max-width: 900px; margin: 0 auto;
  }
  .card {
    background: var(--card); border-radius: 16px; padding: 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,.08);
  }
  h1 { font-size: 22px; color: var(--accent); margin-bottom: 10px; }
  .lead { color: #64748b; font-size: 14px; margin-bottom: 20px; }
  table {
    border-collapse: collapse; margin: 0 auto; user-select: none;
  }
  td {
    width: 32px; height: 32px; text-align: center;
    border: 1px solid #cbd5e1; font-weight: 600;
    cursor: pointer; transition: all .2s ease;
  }
  td.selected { background: #bfdbfe; color: #1e3a8a; }
  td.found { background: #34d399; color: white; }
  .wordlist {
    margin-top: 20px; display: flex; flex-wrap: wrap;
    gap: 12px; justify-content: center;
  }
  .word {
    padding: 8px 14px; background: #e0e7ff;
    border-radius: 8px; font-weight: 600; color: #1e3a8a;
  }
  .foundword {
    background: #34d399; color: white; text-decoration: line-through;
  }
  button {
    margin-top: 24px; padding: 10px 18px; background: var(--accent);
    color: white; border: none; border-radius: 8px; cursor: pointer;
    font-weight: 700;
  }
  #result { font-weight: 700; margin-top: 10px; color: var(--accent); }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>Autoevaluación: Evaluación del Progreso en el Aprendizaje</h1>
    <div class="lead">Encuentra en la sopa de letras los conceptos clave que has aprendido sobre la evaluación del progreso. ¡Reflexiona sobre cómo aplicas cada uno en tu aprendizaje!</div>
    
    <table id="wordsearch"></table>
    
    <div class="wordlist" id="words"></div>
    
    <button id="resetBtn">Reiniciar Sopa</button>
    <div id="result"></div>
  </div>
</div>

<script>
  const gridSize = 12;
  const words = [
    "AUTOEVALUACION",
    "REFLEXION",
    "PROGRESO",
    "METAS",
    "FORTALEZAS",
    "DEBILIDADES",
    "RUBRICA",
    "AUTONOMIA",
    "APRENDIZAJE",
    "MEJORA"
  ];

  const grid = Array.from({ length: gridSize }, () => Array(gridSize).fill(''));
  const directions = [
    [0, 1], [1, 0], [1, 1], [-1, 1]
  ];

  function placeWord(word) {
    for (let attempt = 0; attempt < 100; attempt++) {
      const dir = directions[Math.floor(Math.random() * directions.length)];
      const row = Math.floor(Math.random() * gridSize);
      const col = Math.floor(Math.random() * gridSize);
      let fits = true;
      for (let i = 0; i < word.length; i++) {
        const r = row + dir[0] * i, c = col + dir[1] * i;
        if (r < 0 || c < 0 || r >= gridSize || c >= gridSize || (grid[r][c] && grid[r][c] !== word[i])) {
          fits = false; break;
        }
      }
      if (fits) {
        for (let i = 0; i < word.length; i++) {
          const r = row + dir[0] * i, c = col + dir[1] * i;
          grid[r][c] = word[i];
        }
        return true;
      }
    }
    return false;
  }

  words.forEach(w => placeWord(w));

  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      if (!grid[r][c]) grid[r][c] = letters[Math.floor(Math.random() * letters.length)];
    }
  }

  const table = document.getElementById('wordsearch');
  grid.forEach((row, i) => {
    const tr = document.createElement('tr');
    row.forEach((letter, j) => {
      const td = document.createElement('td');
      td.textContent = letter;
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });

  const wordList = document.getElementById('words');
  words.forEach(w => {
    const span = document.createElement('div');
    span.className = 'word';
    span.textContent = w;
    wordList.appendChild(span);
  });

  const cells = document.querySelectorAll('td');
  let selected = [];
  cells.forEach(cell => {
    cell.addEventListener('click', () => {
      if (cell.classList.contains('found')) return;
      cell.classList.toggle('selected');
      if (cell.classList.contains('selected')) selected.push(cell);
      else selected = selected.filter(c => c !== cell);
      checkSelection();
    });
  });

  function checkSelection() {
    const selectedWord = selected.map(c => c.textContent).join('');
    const reversed = selectedWord.split('').reverse().join('');
    const found = words.find(w => w === selectedWord || w === reversed);
    if (found) {
      selected.forEach(c => { c.classList.add('found'); c.classList.remove('selected'); });
      selected = [];
      const wordEl = Array.from(document.querySelectorAll('.word')).find(w => w.textContent === found);
      wordEl.classList.add('foundword');
      if (document.querySelectorAll('.foundword').length === words.length) {
        document.getElementById('result').textContent = "🎉 ¡Excelente! Has encontrado todos los conceptos clave.";
      }
    }
  }

  document.getElementById('resetBtn').addEventListener('click', () => location.reload());
</script>
</body>
</html>
